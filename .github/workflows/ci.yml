name: Java CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. Checkout source code
      # ----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v5

      # ----------------------------------------
      # 2. Setup Java
      # ----------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ----------------------------------------
      # 3. Build application
      # ----------------------------------------
      - name: Build application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # ----------------------------------------
      # 4. Run Semgrep
      # ----------------------------------------
      - name: Run Semgrep
        run: |
          python3 -m pip install semgrep

          semgrep scan \
            --config auto \
            --json \
            --output semgrep-report.json

          python3 semgrep_to_html.py

          echo "Semgrep scan completed."

      # ----------------------------------------
      # 5. Upload Semgrep reports
      # ----------------------------------------
      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-reports
          path: |
            semgrep-report.json
            semgrep-report.html
