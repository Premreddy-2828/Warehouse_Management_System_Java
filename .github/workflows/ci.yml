name: Java CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Run Semgrep
        run: |
          python3 -m pip install semgrep

          set +e
          semgrep scan \
            --config auto \
            --json \
            --output semgrep-report.json \
            --error

          SEMGREP_EXIT_CODE=$?

          set -e

          echo "Semgrep exit code: $SEMGREP_EXIT_CODE"

          python3 semgrep_to_html.py

          echo "Semgrep HTML report generated."

          exit $SEMGREP_EXIT_CODE

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-reports
          path: |
            semgrep-report.json
            semgrep-report.html
